<form id="uploadForm">

  <div class="app-name">
    <span>App Name</span>
    <strong>Clinic App</strong>
  </div>

  <input
    id="versionInput"
    type="text"
    placeholder="Version, e.g. 1.2.0"
    required
  >

  <input
    id="apkInput"
    type="file"
    accept=".apk"
    required
  >

  <button
    id="publishButton"
    class="button"
    type="submit"
  >
    Upload & Publish
  </button>

</form>
