<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APK Download Portal</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f6f8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    p {
      color: #666;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    button,
    .download-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      background: #111;
      color: white;
      margin-top: 10px;
      text-decoration: none;
      display: block;
      text-align: center;
    }

    button:hover,
    .download-btn:hover {
      opacity: 0.85;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #d93025;
      font-size: 14px;
      text-align: center;
      margin-top: 10px;
    }

    .apk-info {
      margin-top: 25px;
      padding: 20px;
      background: #f8f8f8;
      border-radius: 10px;
    }

    .apk-info h2 {
      margin-top: 0;
    }

    .label {
      font-size: 13px;
      color: #777;
      margin-bottom: 5px;
    }

    .value {
      font-weight: bold;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <!-- PASSWORD PAGE -->
  <div class="card" id="loginPage">
    <h1>🔒 Private APK Portal</h1>
    <p>Enter the password to continue.</p>

    <input
      type="password"
      id="passwordInput"
      placeholder="Enter password"
    />

    <button onclick="checkPassword()">Enter</button>

    <div class="error" id="errorMessage"></div>
  </div>


  <!-- MAIN APP PAGE -->
  <div class="card hidden" id="mainPage">

    <h1>📱 APK Portal</h1>
    <p>Upload an APK and make it available for download.</p>

    <div id="uploadSection">

      <input
        type="text"
        id="appName"
        placeholder="App name"
      />

      <input
        type="text"
        id="versionNumber"
        placeholder="Version number (e.g. 1.0.0)"
      />

      <input
        type="file"
        id="apkFile"
        accept=".apk,application/vnd.android.package-archive"
      />

      <button onclick="uploadAPK()">Upload APK</button>

    </div>


    <!-- APK DOWNLOAD AREA -->
    <div class="apk-info hidden" id="apkInfo">

      <div class="label">APP NAME</div>
      <div class="value" id="displayAppName"></div>

      <div class="label">VERSION</div>
      <div class="value" id="displayVersion"></div>

      <div class="label">FILE</div>
      <div class="value" id="displayFileName"></div>

      <a
        id="downloadLink"
        class="download-btn"
        download
      >
        ⬇ Download APK
      </a>

    </div>

  </div>


  <script>

    // CHANGE THIS PASSWORD
    const SITE_PASSWORD = "Drsalim";


    function checkPassword() {

      const password =
        document.getElementById("passwordInput").value;

      const errorMessage =
        document.getElementById("errorMessage");

      if (password === SITE_PASSWORD) {

        document
          .getElementById("loginPage")
          .classList.add("hidden");

        document
          .getElementById("mainPage")
          .classList.remove("hidden");

      } else {

        errorMessage.textContent =
          "Incorrect password. Try again.";

      }

    }


    function uploadAPK() {

      const appName =
        document.getElementById("appName").value;

      const version =
        document.getElementById("versionNumber").value;

      const fileInput =
        document.getElementById("apkFile");

      const file = fileInput.files[0];


      if (!appName || !version || !file) {

        alert(
          "Please enter an app name, version number, and select an APK."
        );

        return;

      }


      if (!file.name.toLowerCase().endsWith(".apk")) {

        alert("Please select a valid APK file.");

        return;

      }


      // Create temporary download URL
      const apkURL = URL.createObjectURL(file);


      document.getElementById("displayAppName").textContent =
        appName;

      document.getElementById("displayVersion").textContent =
        version;

      document.getElementById("displayFileName").textContent =
        file.name;


      const downloadLink =
        document.getElementById("downloadLink");

      downloadLink.href = apkURL;

      downloadLink.download =
        appName.replace(/\s+/g, "-") +
        "-" +
        version +
        ".apk";


      document
        .getElementById("apkInfo")
        .classList.remove("hidden");

    }

  </script>

</body>
</html>
