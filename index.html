<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APK Download</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <div class="badge">APK DISTRIBUTION</div>
  <h1 id="appName">Loading…</h1>
  <p class="subtitle">Download the latest available Android application.</p>
  <section id="release" class="release hidden">
    <div><span>Version</span><strong id="version"></strong></div>
    <div><span>Released</span><strong id="releasedAt"></strong></div>
    <a id="download" class="button" href="#" download>Download APK</a>
  </section>
  <p id="status" class="status">Checking for the latest release…</p>
  <a class="admin-link" href="admin.html">Admin</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
